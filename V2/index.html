<!-- JAVASCRIPT -->




<script>
const banner = document.getElementById("banner");

// Page enter animation
window.addEventListener("DOMContentLoaded", () => {
  banner.classList.add("enter");
});

// Scroll listener to trigger banner at bottom
window.addEventListener("scroll", () => {
  const scrollTop = window.scrollY;
  const windowHeight = window.innerHeight;
  const docHeight = document.body.scrollHeight;

  if (scrollTop + windowHeight >= docHeight - 5) {
    if (!banner.classList.contains("exit")) {
      banner.classList.add("exit");
      setTimeout(() => {
        window.location.href = "commons.html"; // next page
      }, 1000);
    }
  }
});

// Faster continuous scroll (~4× speed)
const arrow = document.querySelector(".arrow");
arrow.addEventListener("click", e => {
  e.preventDefault();

  const start = window.scrollY;
  const end = document.body.scrollHeight - window.innerHeight;
  const duration = 0; // 4× faster than 2s
  const startTime = performance.now();

  function step(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1); // linear
    const scrollPosition = start + (end - start) * progress;
    window.scrollTo(0, scrollPosition);

    if (progress < 1) {
      requestAnimationFrame(step);
    }
  }

  requestAnimationFrame(step);
});
</script>
